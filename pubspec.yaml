name: alonzo_advmobprog_longexam1
description: "CCITBook - Flutter social media replication"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.2.3
  http: ^1.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/assets/images/
  fonts:
    - family: Frutiger
      fonts:
        - asset: lib/assets/fonts/FrutigerLTStd-Roman.otf
    - family: Klavika
      fonts:
        - asset: lib/assets/fonts/KlavikaBoldBold.otf
